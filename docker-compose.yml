services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets n8n reach Ollama on the host machine
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
